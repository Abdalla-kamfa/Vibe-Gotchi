openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vibe
    description: AI vibe analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vibe/analyze:
    post:
      operationId: analyzeVibe
      tags: [vibe]
      summary: Analyze developer vibe from GitHub commit data
      description: Uses AI to analyze commit messages and generate a pet personality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VibeInput"
      responses:
        "200":
          description: Vibe analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VibeResult"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VibeInput:
      type: object
      required:
        - commitMessages
        - topLanguage
        - commitCount
        - daysSinceLastCommit
      properties:
        commitMessages:
          type: array
          items:
            type: string
          description: Last 5 commit message strings
        topLanguage:
          type: string
          description: Most used programming language
        commitCount:
          type: integer
          description: Number of commits in last 30 days
        daysSinceLastCommit:
          type: integer
          description: Days since the last commit
    VibeResult:
      type: object
      required:
        - vibeOneLiner
        - petPersonality
        - moodBoost
      properties:
        vibeOneLiner:
          type: string
          description: Punchy, funny one-liner about the developer (max 60 chars)
        petPersonality:
          type: string
          description: One-word personality type
          enum: [Chaotic, Disciplined, Sleepy, Feral, Legendary, Ghost]
        moodBoost:
          type: string
          description: Whether to boost the mood display
          enum: [positive, neutral, negative]
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
